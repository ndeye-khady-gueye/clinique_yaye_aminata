<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Frontend Auth</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 15px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Test Frontend Authentication & API</h1>
    
    <div class="section info">
        <h3>📋 État de l'authentification</h3>
        <div id="auth-status">Vérification...</div>
        <button onclick="checkAuth()">Vérifier l'auth</button>
        <button onclick="clearAuth()">Effacer l'auth</button>
    </div>

    <div class="section">
        <h3>👥 Test des données</h3>
        <button onclick="testPatients()">Test Patients</button>
        <button onclick="testDoctors()">Test Médecins</button>
        <button onclick="testServices()">Test Services</button>
        <div id="api-results"></div>
    </div>

    <div class="section">
        <h3>🔧 Debug Info</h3>
        <pre id="debug-info"></pre>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        
        function updateDebugInfo() {
            const debugInfo = document.getElementById('debug-info');
            const authToken = localStorage.getItem('authToken');
            const userData = localStorage.getItem('userData');
            
            debugInfo.textContent = `Auth Token: ${authToken ? '✅ Présent' : '❌ Absent'}
User Data: ${userData ? '✅ Présent' : '❌ Absent'}
Token Length: ${authToken ? authToken.length : 0}
Current URL: ${window.location.href}`;
        }

        function checkAuth() {
            const authStatus = document.getElementById('auth-status');
            const authToken = localStorage.getItem('authToken');
            const userData = localStorage.getItem('userData');
            
            if (authToken && userData) {
                try {
                    const user = JSON.parse(userData);
                    authStatus.innerHTML = `
                        <div class="success">
                            ✅ Authentifié<br>
                            Utilisateur: ${user.first_name} ${user.last_name}<br>
                            Rôle: ${user.role}<br>
                            Token: ${authToken.substring(0, 20)}...
                        </div>
                    `;
                } catch (e) {
                    authStatus.innerHTML = `
                        <div class="error">
                            ❌ Erreur parsing userData: ${e.message}
                        </div>
                    `;
                }
            } else {
                authStatus.innerHTML = `
                    <div class="error">
                        ❌ Non authentifié<br>
                        Token: ${authToken ? 'Présent' : 'Absent'}<br>
                        UserData: ${userData ? 'Présent' : 'Absent'}
                    </div>
                `;
            }
            updateDebugInfo();
        }

        function clearAuth() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userData');
            checkAuth();
        }

        async function makeApiCall(endpoint, description) {
            const resultsDiv = document.getElementById('api-results');
            const authToken = localStorage.getItem('authToken');
            
            if (!authToken) {
                resultsDiv.innerHTML = `<div class="error">❌ Pas de token d'authentification</div>`;
                return;
            }

            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultsDiv.innerHTML = `
                        <div class="success">
                            ✅ ${description}<br>
                            Status: ${response.status}<br>
                            Count: ${data.count || data.length || 'N/A'}<br>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="error">
                            ❌ ${description}<br>
                            Status: ${response.status}<br>
                            Error: ${data.detail || JSON.stringify(data)}
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="error">
                        ❌ Erreur réseau: ${error.message}
                    </div>
                `;
            }
        }

        function testPatients() {
            makeApiCall('/users/?role=patient', 'Test Patients');
        }

        function testDoctors() {
            makeApiCall('/users/?role=doctor', 'Test Médecins');
        }

        function testServices() {
            makeApiCall('/services/actifs/', 'Test Services');
        }

        // Initialisation
        checkAuth();
        updateDebugInfo();
    </script>
</body>
</html>
